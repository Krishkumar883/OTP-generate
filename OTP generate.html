<html>
    <head>
        <title>otp generate</title>
        <style>
            body{
                text-align: center;
                font-family: arial;
                margin-top: 100px;
            }
            #otp{
                font-size: 30px;
                color: rgb(137, 70, 195);
                margin-top: 20px;        
             }
             .box{
                border: 2px solid black;
                border-radius: 20px;
             width: 300px;
             height: 200px;
             background-color: rgb(177, 230, 232);
             border-color: rgb(51, 51, 230);
             box-shadow: 1PX 2PX 3PX rgb(51, 51, 230);
             }
             h1{
                color: red;
             }
             button{
                background-color: rgb(153, 255, 0);
                border: 2px solid rgb(153, 255, 0);
                width: 150px;
                height:50px; 
                border-radius: 50px; 
                padding: 5px; 
                box-shadow: 5px 5px 5px;
             }
        </style>
    </head>
    <body>
        <center>
            <div class="box">
            <h2>OTP generate</h2>
            <button onclick="generateOTP()" >Generate Otp</button>
            <div id="otp"></div>
            </div>
            <script>
               function generateOTP() {
                let otp= Math.floor (100000 + Math.random() * 900000);
                document.getElementById("otp").innerText=otp;
               }
            </script>
        </center>
    </body>
</html>
